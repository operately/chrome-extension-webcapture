<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capture to Operately settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <div class="brand"><img src="../icons/icon.svg" alt="" aria-hidden="true" /><span>Capture to Operately</span></div>
      <section>
        <p class="eyebrow">Connection</p>
        <h1>Operately server</h1>
        <p class="intro">Use Operately Cloud, or connect the extension to your organization’s self-hosted server.</p>
        <form id="settings-form">
          <label for="base-url">Server URL</label>
          <input id="base-url" type="url" placeholder="https://app.operately.com" required />
          <p class="hint">Only this server can receive the pages you capture.</p>
          <p id="message" class="message" role="status"></p>
          <button type="submit">Save connection</button>
        </form>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
